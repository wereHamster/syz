name: Cache Primer

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  primer:
    name: Cache Primer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix run github:nicknovitski/nix-develop .#workflow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
      - run: cargo build --locked --all-features --all-targets
      - run: cargo test --locked --all-targets --no-run
