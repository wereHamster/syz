[package]
name = "release-notes"
version = "0.1.0"
edition = "2021"
description = "Forge-agnostic release notes / changelog fetching for package repositories."

[dependencies]
anyhow.workspace = true
async-trait = "0.1.89"
base64 = "0.23.0"
bytes = "1.11.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde"] }
percent-encoding = "2.3"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tokio = { version = "1.50.0", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
# Minimal transport for the live integration tests only (never linked into
# the crate's dependencies).
reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }

[features]
# Gates tests that require live network access. They use GITHUB_TOKEN when set
# (CI always sets it). Mirrors the root crate's feature of the same name.
integration-tests = []
# Exposes MockForge for downstream tests.
test-util = []
